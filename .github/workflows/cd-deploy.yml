name: Deploy Application

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "production"
        type: choice
        options:
          - production
      deploy_landing:
        description: "Deploy landing site"
        required: false
        default: true
        type: boolean
      deploy_frontend:
        description: "Deploy admin frontend"
        required: false
        default: true
        type: boolean
      deploy_backend:
        description: "Deploy backend to EC2"
        required: false
        default: true
        type: boolean

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1

jobs:
  # ─── Landing Site → S3 + CloudFront ────────────────────────────────────────
  deploy-landing:
    name: Deploy Landing Site
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    if: github.event.inputs.deploy_landing != 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build landing site
        run: pnpm --filter landing build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_S3 }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_S3 }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy landing to S3
        run: |
          S3_BUCKET="${{ vars.LANDING_S3_BUCKET }}"

          if [ -z "$S3_BUCKET" ]; then
            echo "⚠️ LANDING_S3_BUCKET not set, skipping"
            exit 0
          fi

          echo "📦 Deploying to s3://${S3_BUCKET}"

          # Versioned assets: long-lived cache
          aws s3 sync apps/landing/dist "s3://${S3_BUCKET}" \
            --delete \
            --region "${{ env.AWS_REGION }}" \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

          # HTML: always revalidate
          aws s3 cp apps/landing/dist/index.html "s3://${S3_BUCKET}/index.html" \
            --region "${{ env.AWS_REGION }}" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"

          echo "✅ Landing uploaded"

      - name: Invalidate CloudFront
        run: |
          DIST_ID="${{ vars.LANDING_CF_DISTRIBUTION }}"
          if [ -z "$DIST_ID" ]; then
            echo "⚠️ LANDING_CF_DISTRIBUTION not set, skipping"
            exit 0
          fi
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" --region us-east-1
          echo "✅ CloudFront invalidated"

  # ─── Admin Frontend → S3 + CloudFront ──────────────────────────────────────
  deploy-frontend:
    name: Deploy Admin Frontend
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    if: github.event.inputs.deploy_frontend != 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build workspace packages
        uses: ./.github/actions/build-packages

      - name: Build admin frontend
        run: pnpm --filter @apps/frontend build
        env:
          VITE_API_URL: ${{ vars.API_BASE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_S3 }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_S3 }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy admin to S3
        run: |
          S3_BUCKET="${{ vars.ADMIN_S3_BUCKET }}"

          if [ -z "$S3_BUCKET" ]; then
            echo "⚠️ ADMIN_S3_BUCKET not set, skipping"
            exit 0
          fi

          echo "📦 Deploying to s3://${S3_BUCKET}"

          # Versioned assets: long-lived cache
          aws s3 sync apps/frontend/dist "s3://${S3_BUCKET}" \
            --delete \
            --region "${{ env.AWS_REGION }}" \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

          # HTML: always revalidate
          aws s3 cp apps/frontend/dist/index.html "s3://${S3_BUCKET}/index.html" \
            --region "${{ env.AWS_REGION }}" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"

          echo "✅ Admin frontend uploaded"

      - name: Invalidate CloudFront
        run: |
          DIST_ID="${{ vars.ADMIN_CF_DISTRIBUTION }}"
          if [ -z "$DIST_ID" ]; then
            echo "⚠️ ADMIN_CF_DISTRIBUTION not set, skipping"
            exit 0
          fi
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" --region us-east-1
          echo "✅ CloudFront invalidated"

  # ─── Backend → EC2 via SSH ──────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    if: github.event.inputs.deploy_backend != 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build workspace packages
        uses: ./.github/actions/build-packages

      - name: Build backend
        run: pnpm --filter @apps/backend build

      - name: Backup current backend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          script: |
            set -e
            APP_DIR="/home/ec2-user/campaign-forge"
            if [ -d "${APP_DIR}/apps/backend/dist" ]; then
              rm -rf "${APP_DIR}/apps/backend/dist.prev"
              cp -r "${APP_DIR}/apps/backend/dist" "${APP_DIR}/apps/backend/dist.prev"
              echo "✅ Backed up current dist → dist.prev (for rollback)"
            else
              echo "ℹ️ No existing dist to back up (first deploy)"
            fi

      - name: Upload dist to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          # Every workspace package.json must ship, not just the backend's: `pnpm install
          # --frozen-lockfile` validates the lockfile against ALL workspace projects, so a stale
          # apps/frontend/package.json on the box fails the install the moment a frontend
          # dependency changes (ERR_PNPM_OUTDATED_LOCKFILE) — even though the backend does not
          # use it. apps/backend/migrations/ ships so schema changes can be applied on the box.
          source: "apps/backend/dist/,apps/backend/package.json,apps/backend/migrations/,apps/frontend/package.json,apps/landing/package.json,packages/types/dist/,packages/types/package.json,packages/ui/package.json,packages/utils/package.json,infrastructure/package.json,package.json,pnpm-lock.yaml,pnpm-workspace.yaml"
          target: "/home/ec2-user/campaign-forge/"
          tar_dereference: true
          overwrite: true

      - name: Restart backend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          script: |
            set -e
            REGION="eu-north-1"
            PREFIX="/campaign-forge/production"
            APP_DIR="/home/ec2-user/campaign-forge"

            echo "🔑 Refreshing secrets from SSM..."
            ssm_get() {
              aws ssm get-parameter \
                --region "$REGION" \
                --name "${PREFIX}/$1" \
                --with-decryption \
                --query "Parameter.Value" \
                --output text
            }
            # Returns empty (not a failure) when the param does not exist yet — used for
            # optional Lex keys that only appear once the Lex infra is provisioned.
            ssm_get_optional() {
              aws ssm get-parameter \
                --region "$REGION" \
                --name "${PREFIX}/$1" \
                --with-decryption \
                --query "Parameter.Value" \
                --output text 2>/dev/null || true
            }

            cat > "${APP_DIR}/apps/backend/.env" <<ENVEOF
            NODE_ENV=production
            PORT=3001
            AWS_REGION=${REGION}
            AWS_ACCESS_KEY_ID=$(ssm_get AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY=$(ssm_get AWS_SECRET_ACCESS_KEY)
            CONTACTS_TABLE=$(ssm_get CONTACTS_TABLE)
            CAMPAIGNS_TABLE=$(ssm_get CAMPAIGNS_TABLE)
            GROUPS_TABLE=$(ssm_get GROUPS_TABLE)
            S3_BUCKET=$(ssm_get S3_BUCKET)
            SES_FROM_EMAIL=$(ssm_get SES_FROM_EMAIL)
            SES_REGION=${REGION}
            UNSUBSCRIBE_SECRET=$(ssm_get UNSUBSCRIBE_SECRET)
            PUBLIC_BASE_URL=$(ssm_get PUBLIC_BASE_URL)
            ADMIN_CREDENTIALS=$(ssm_get ADMIN_CREDENTIALS)
            JWT_SECRET=$(ssm_get JWT_SECRET)
            ENVEOF

            # ── Optional Lex keys ────────────────────────────────────────────────────
            # Appended ONLY when the SSM param exists, so an empty value never lands in
            # .env. (An empty `DATABASE_URL=` line would fail the backend's config
            # validation and crash the shared process, taking Campaigns down.)
            append_if_set() {
              if [ -n "$2" ]; then echo "$1=$2" >> "${APP_DIR}/apps/backend/.env"; fi
            }
            append_if_set DATABASE_URL "$(ssm_get_optional DATABASE_URL)"
            append_if_set OPENAI_API_KEY_SECRET_ARN "$(ssm_get_optional OPENAI_API_KEY_SECRET_ARN)"
            append_if_set LEX_DOCUMENTS_BUCKET "$(ssm_get_optional LEX_DOCUMENTS_BUCKET)"

            chmod 600 "${APP_DIR}/apps/backend/.env"

            echo "📦 Installing backend runtime dependencies..."
            if ! command -v pnpm >/dev/null 2>&1; then
              sudo corepack enable
              corepack prepare pnpm@10.8.0 --activate
            fi
            cd "${APP_DIR}"
            export HUSKY=0
            export CI=true
            pnpm install --prod --frozen-lockfile --ignore-scripts --filter @apps/backend...

            # ── Schema migrations, BEFORE the new code starts ──────────────────────
            # Ordering is not cosmetic: a build whose ingestion worker selects
            # lex_ingestion_jobs.mode, or whose chat path reads the authorities tables,
            # fails every Lex request if it boots against an older schema. Running here
            # means a migration failure aborts the deploy while the OLD code is still
            # serving, and the dist.prev rollback below is never even needed.
            # Skipped entirely when DATABASE_URL is absent — that is a Campaigns-only
            # box with Lex dormant, and there is no Lex schema to migrate.
            DB_URL=$(grep '^DATABASE_URL=' "${APP_DIR}/apps/backend/.env" | cut -d= -f2-)
            if [ -n "$DB_URL" ]; then
              echo "🗄️ Applying database migrations..."
              cd "${APP_DIR}/apps/backend"
              DATABASE_URL="$DB_URL" pnpm exec node-pg-migrate up
              cd "${APP_DIR}"
              echo "✅ Migrations applied"
            else
              echo "ℹ️ DATABASE_URL not set — Lex dormant, no migrations to apply"
            fi

            echo "♻️ Restarting backend with PM2..."
            pm2 restart campaign-forge-api || pm2 start ${APP_DIR}/apps/backend/dist/main.js \
              --name campaign-forge-api \
              --cwd "${APP_DIR}/apps/backend" \
              --env production
            pm2 save

            echo "🏥 Health check (blocking)..."
            HEALTH_OK=0
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
                HEALTH_OK=1; echo "✅ Health check passed (attempt ${i})"; break
              fi
              echo "…waiting for backend to become healthy (${i}/15)"
              sleep 4
            done

            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "❌ Health check FAILED — backend did not become healthy"
              echo "----- last 60 lines of API error log -----"
              tail -n 60 /home/ec2-user/.pm2/logs/campaign-forge-api-error.log 2>/dev/null || true
              if [ -d "${APP_DIR}/apps/backend/dist.prev" ]; then
                echo "⏪ Rolling back to the previous dist to keep the live app up..."
                rm -rf "${APP_DIR}/apps/backend/dist"
                cp -r "${APP_DIR}/apps/backend/dist.prev" "${APP_DIR}/apps/backend/dist"
                pm2 restart campaign-forge-api || true
                sleep 5
                if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
                  echo "✅ Rolled back to the previous version successfully"
                else
                  echo "⚠️ Rollback restart still unhealthy — manual intervention required"
                fi
              fi
              # Fail the deploy loudly instead of reporting success over a crash-loop.
              exit 1
            fi

            echo "✅ Backend deployed and healthy"

  # ─── Summary ────────────────────────────────────────────────────────────────
  deployment-complete:
    name: Deployment Complete
    runs-on: ubuntu-latest
    needs: [deploy-landing, deploy-frontend, deploy-backend]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "Landing:  ${{ needs.deploy-landing.result }}"
          echo "Frontend: ${{ needs.deploy-frontend.result }}"
          echo "Backend:  ${{ needs.deploy-backend.result }}"

          if [[ "${{ needs.deploy-landing.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-frontend.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-backend.result }}" == "failure" ]]; then
            echo "❌ Deployment failed"
            exit 1
          else
            echo "✅ All deployments complete"
          fi
